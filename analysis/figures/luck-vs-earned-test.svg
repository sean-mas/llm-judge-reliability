idth="43.3" height="34" fill="#7fa8cc"/><text x="396.7" y="192.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">42%</text><text x="546.6" y="192.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">+9.4 pp earned    kappa 0.162</text><text x="286.0" y="251.0" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 3</text><text x="286.0" y="268.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">flags 21.1%</text><rect x="300" y="236" width="460" height="34" fill="#f2f2f2"/><rect x="300" y="236" width="180.8" height="34" fill="#d4d4d4"/><rect x="480.8" y="236" width="36.6" height="34" fill="#bcd3e6"/><text x="390.4" y="258.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">39%</text><text x="527.4" y="258.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">+8.0 pp earned    kappa 0.131</text><rect x="300" y="310" width="16" height="12" fill="#d4d4d4"/><text x="324.0" y="320.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">agreement chance alone would produce</text><rect x="592" y="310" width="16" height="12" fill="#2f5d8c"/><text x="616.0" y="320.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">earned above chance</text><text x="40.0" y="404.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The grey block is what two raters hit by coincidence at these f