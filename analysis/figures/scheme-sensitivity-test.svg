<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="860" height="440" fill="#ffffff"/><text x="40.0" y="44.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The choice of statistic outweighs the choice of model</text><text x="40.0" y="68.0" font-size="13" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">test split. Cohen's kappa for the same judgments, regrouped under FaithBench's three binarisation schemes.</text><line x1="260" y1="330.0" x2="740" y2="330.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="334.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.00</text><line x1="260" y1="286.0" x2="740" y2="286.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="290.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.05</text><line x1="260" y1="242.0" x2="740" y2="242.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="246.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.10</text><line x1="260" y1="198.0" x2="740" y2="198.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="202.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.15</text><line x1="260" y1="154.0" x2="740" y2="154.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="158.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.20</text><line x1="260" y1="110.0" x2="740" y2="110.0" stroke="#d4d4d4" stroke-dasharray="2 4"/><text x="250.0" y="114.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0.25</text><text x="300.0" y="356.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">U</text><text x="500.0" y="356.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">U+Q</text><text x="500.0" y="374.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">primary</text><text x="700.0" y="356.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">U+Q+B</text><text x="700.0" y="374.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">FaithJudge's scheme</text><path d="M300.0,215.2 L500.0,216.8 L700.0,262.6" fill="none" stroke="#2f5d8c" stroke-width="3"/><circle cx="300.0" cy="215.2" r="5" fill="#2f5d8c"/><circle cx="500.0" cy="216.8" r="5" fill="#2f5d8c"/><circle cx="700.0" cy="262.6" r="5" fill="#2f5d8c"/><path d="M300.0,158.0 L500.0,187.1 L700.0,219.2" fill="none" stroke="#7fa8cc" stroke-width="3"/><circle cx="300.0" cy="158.0" r="5" fill="#7fa8cc"/><circle cx="500.0" cy="187.1" r="5" fill="#7fa8cc"/><circle cx="700.0" cy="219.2" r="5" fill="#7fa8cc"/><path d="M300.0,185.6 L500.0,214.6 L700.0,234.0" fill="none" stroke="#bcd3e6" stroke-width="3"/><circle cx="300.0" cy="185.6" r="5" fill="#bcd3e6"/><circle cx="500.0" cy="214.6" r="5" fill="#bcd3e6"/><circle cx="700.0" cy="234.0" r="5" fill="#bcd3e6"/><text x="716.0" y="223.2" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 2</text><text x="716.0" y="238.2" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 3</text><text x="716.0" y="266.6" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 1</text><text x="40.0" y="394.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Regrouping the reference labels moves kappa by up to 0.070. The widest gap between the three deployment tiers,</text><text x="40.0" y="414.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">within any one scheme, is 0.065. Same judgments throughout: not one extra API call was made.</text></svg>