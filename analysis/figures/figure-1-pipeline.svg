<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img">
<title>Figure 1: Study pipeline</title>
<desc>Flow from the FaithBench dataset through two parallel paths: a human reference path building reference labels, and a judge path where a frozen binary rubric is sent to three judge tiers, then both meet in analysis producing four reported statistics.</desc>
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 500; }
  .t  { font-size: 14px; font-weight: 400; }
  .ts { font-size: 12px; font-weight: 400; fill: #4a4a4a; }
  .box  { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.2; }
  .ref  { fill: #e4f2f0; stroke: #4f938c; stroke-width: 1.2; }
  .jdg  { fill: #e6edf7; stroke: #4a7ab5; stroke-width: 1.2; }
  .arr  { fill: none; stroke: #6a6a6a; stroke-width: 1.4; marker-end: url(#ah); }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#6a6a6a" stroke-width="1.4"/>
  </marker>
</defs>

<rect class="box" x="190" y="40" width="300" height="54" rx="4"/>
<text class="th" x="340" y="66" text-anchor="middle">FaithBench</text>
<text class="ts" x="340" y="84" text-anchor="middle">750 items, span-level annotation</text>

<path class="arr" d="M340 94 L340 114 L170 114 L170 134"/>
<path class="arr" d="M340 94 L340 114 L510 114 L510 134"/>

<rect class="ref" x="40" y="134" width="260" height="70" rx="4"/>
<text class="th" x="170" y="158" text-anchor="middle">loader.py</text>
<text class="ts" x="170" y="176" text-anchor="middle">most-severe wins</text>
<text class="ts" x="170" y="193" text-anchor="middle">validated 99.44%</text>

<rect class="jdg" x="380" y="134" width="260" height="70" rx="4"/>
<text class="th" x="510" y="158" text-anchor="middle">rubric.py</text>
<text class="ts" x="510" y="176" text-anchor="middle">binary verdict, frozen</text>
<text class="ts" x="510" y="193" text-anchor="middle">prompt hash recorded</text>

<path class="arr" d="M170 204 L170 244"/>

<rect class="ref" x="40" y="244" width="260" height="70" rx="4"/>
<text class="th" x="170" y="268" text-anchor="middle">reference labels</text>
<text class="ts" x="170" y="286" text-anchor="middle">239 pass, 511 fail</text>
<text class="ts" x="170" y="303" text-anchor="middle">dev 262, test 488</text>

<path class="arr" d="M510 204 L510 214 L360 214 L360 267 L380 267"/>
<path class="arr" d="M360 214 L360 325 L380 325"/>
<path class="arr" d="M360 214 L360 383 L380 383"/>

<rect class="jdg" x="380" y="244" width="240" height="46" rx="4"/>
<text class="th" x="500" y="264" text-anchor="middle">tier 1, paid API</text>
<text class="ts" x="500" y="281" text-anchor="middle">frontier commercial model</text>

<rect class="jdg" x="380" y="302" width="240" height="46" rx="4"/>
<text class="th" x="500" y="322" text-anchor="middle">tier 2, hosted</text>
<text class="ts" x="500" y="339" text-anchor="middle">open weights, hosted</text>

<rect class="jdg" x="380" y="360" width="240" height="46" rx="4"/>
<text class="th" x="500" y="380" text-anchor="middle">tier 3, local</text>
<text class="ts" x="500" y="397" text-anchor="middle">open weights, on premise</text>

<path class="arr" d="M620 267 L640 267 L640 412 L510 412 L510 430"/>
<path class="arr" d="M620 325 L640 325"/>
<path class="arr" d="M620 383 L640 383"/>

<rect class="jdg" x="380" y="430" width="260" height="54" rx="4"/>
<text class="th" x="510" y="456" text-anchor="middle">runner.py and store.py</text>
<text class="ts" x="510" y="474" text-anchor="middle">6,750 rows, cached, resumable</text>

<path class="arr" d="M170 314 L170 496 L250 496 L250 520"/>
<path class="arr" d="M510 484 L510 496 L430 496 L430 520"/>

<rect class="box" x="190" y="520" width="300" height="54" rx="4"/>
<text class="th" x="340" y="546" text-anchor="middle">analysis</text>
<text class="ts" x="340" y="564" text-anchor="middle">judge verdict vs reference labels</text>

<path class="arr" d="M340 574 L340 592 L107 592 L107 612"/>
<path class="arr" d="M340 592 L262 592 L262 612"/>
<path class="arr" d="M340 592 L417 592 L417 612"/>
<path class="arr" d="M340 592 L572 592 L572 612"/>

<rect class="box" x="40" y="612" width="135" height="56" rx="4"/>
<text class="th" x="107" y="636" text-anchor="middle">kappa, PABAK</text>
<text class="ts" x="107" y="654" text-anchor="middle">chance-corrected</text>

<rect class="box" x="195" y="612" width="135" height="56" rx="4"/>
<text class="th" x="262" y="636" text-anchor="middle">TPR and TNR</text>
<text class="ts" x="262" y="654" text-anchor="middle">with 95% CI</text>

<rect class="box" x="350" y="612" width="135" height="56" rx="4"/>
<text class="th" x="417" y="636" text-anchor="middle">gate verdict</text>
<text class="ts" x="417" y="654" text-anchor="middle">threshold sweep</text>

<rect class="box" x="505" y="612" width="135" height="56" rx="4"/>
<text class="th" x="572" y="636" text-anchor="middle">corrected rate</text>
<text class="ts" x="572" y="654" text-anchor="middle">from TPR, TNR</text>

<rect class="ref" x="40" y="686" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="696">human reference path</text>
<rect class="jdg" x="240" y="686" width="12" height="12" rx="2"/>
<text class="ts" x="258" y="696">judge path, three tiers</text>
</svg>
