<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/><text x="40.0" y="44.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Conservative, not degenerate</text><text x="40.0" y="68.0" font-size="13" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">dev split, scheme U+Q. The two rates a single accuracy figure would average away.</text><text x="375.0" y="94.0" font-size="12" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">caught, of the unfaithful  (TPR)</text><text x="685.0" y="94.0" font-size="12" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">passed, of the faithful  (TNR)</text><text x="236.0" y="130.0" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 1</text><rect x="250" y="108" width="250" height="32" fill="#f2f2f2"/><rect x="250" y="108" width="65.1" height="32" fill="#a33"/><text x="258.0" y="130.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">26.0%</text><rect x="560" y="108" width="250" height="32" fill="#f2f2f2"/><rect x="560" y="108" width="237.3" height="32" fill="#2f5d8c"/><text x="568.0" y="130.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">94.9%</text><text x="236.0" y="196.0" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 2</text><rect x="250" y="174" width="250" height="32" fill="#f2f2f2"/><rect x="250" y="174" width="92.9" height="32" fill="#a33"/><text x="258.0" y="196.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">37.2%</text><rect x="560" y="174" width="250" height="32" fill="#f2f2f2"/><rect x="560" y="174" width="218.5" height="32" fill="#7fa8cc"/><text x="568.0" y="196.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">87.4%</text><text x="236.0" y="262.0" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 3</text><rect x="250" y="240" width="250" height="32" fill="#f2f2f2"/><rect x="250" y="240" width="81.7" height="32" fill="#a33"/><text x="258.0" y="262.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">32.7%</text><rect x="560" y="240" width="250" height="32" fill="#f2f2f2"/><rect x="560" y="240" width="231.5" height="32" fill="#bcd3e6"/><text x="568.0" y="262.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">92.6%</text><text x="40.0" y="356.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The judges almost never raise a false alarm and miss roughly two thirds of what they exist to catch.</text><text x="40.0" y="376.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Averaged into one accuracy figure, the left column disappears.</text></svg>