<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/><text x="40.0" y="44.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Batch-level release-gate simulation</text><text x="40.0" y="68.0" font-size="13" fill="#6b6b6b" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">test split, scheme U+Q. The release is blocked when the flagged share of the batch exceeds the threshold T.</text><rect x="286.1" y="126" width="284.5" height="72" fill="#f2dede"/><text x="428.3" y="152.0" font-size="13" fill="#a33" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">judge-based policy ships</text><text x="428.3" y="170.0" font-size="13" fill="#a33" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">reference-based policy blocks</text><line x1="90" y1="226" x2="790" y2="226" stroke="#1a1a1a" stroke-width="1.5"/><line x1="90.0" y1="220" x2="90.0" y2="226" stroke="#1a1a1a"/><text x="90.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">0%</text><line x1="230.0" y1="220" x2="230.0" y2="226" stroke="#1a1a1a"/><text x="230.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">20%</text><line x1="370.0" y1="220" x2="370.0" y2="226" stroke="#1a1a1a"/><text x="370.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">40%</text><line x1="510.0" y1="220" x2="510.0" y2="226" stroke="#1a1a1a"/><text x="510.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">60%</text><line x1="650.0" y1="220" x2="650.0" y2="226" stroke="#1a1a1a"/><text x="650.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">80%</text><line x1="790.0" y1="220" x2="790.0" y2="226" stroke="#1a1a1a"/><text x="790.0" y="214.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">100%</text><text x="440.0" y="344.0" font-size="12" fill="#6b6b6b" text-anchor="middle" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">gate threshold T</text><line x1="570.5" y1="108" x2="570.5" y2="226" stroke="#a33" stroke-width="2.5"/><text x="570.5" y="98.0" font-size="13" fill="#a33" text-anchor="middle" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">reference failure rate  68.6%</text><line x1="227.0" y1="228" x2="227.0" y2="252" stroke="#2f5d8c" stroke-width="2.5"/><line x1="237.5" y1="228" x2="237.5" y2="282" stroke="#bcd3e6" stroke-width="2.5"/><line x1="286.1" y1="228" x2="286.1" y2="312" stroke="#7fa8cc" stroke-width="2.5"/><rect x="235.0" y="242" width="119" height="19" fill="#ffffff"/><circle cx="227.0" cy="252" r="4.5" fill="#2f5d8c"/><text x="239.0" y="256.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 1 flags 19.6%</text><rect x="245.5" y="272" width="119" height="19" fill="#ffffff"/><circle cx="237.5" cy="282" r="4.5" fill="#bcd3e6"/><text x="249.5" y="286.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 3 flags 21.1%</text><rect x="294.1" y="302" width="119" height="19" fill="#ffffff"/><circle cx="286.1" cy="312" r="4.5" fill="#7fa8cc"/><text x="298.1" y="316.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Tier 2 flags 28.0%</text><text x="40.0" y="374.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">For any T between 28.0% and 68.6%, an interval 40.6 points wide, all three judge-based policies</text><text x="40.0" y="394.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">recommend shipping while the reference-based policy recommends blocking.</text></svg>